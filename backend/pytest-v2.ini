[pytest]
testpaths = tests_v2
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
addopts = -m "not network and not slow and not evaluation and not live"
markers =
    unit: isolated unit test
    integration: database or API integration test
    ui: browser-facing test
    network: external network test (never enabled by default)
    slow: slow test (run via --slow or -m live)
    evaluation: quality evaluation test (run only via --evaluation)
    live: live network / provider test, uses real endpoints; run only explicitly
